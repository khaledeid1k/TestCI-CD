name: CI/CD - Build, Coverage, Deploy

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  compile:
    name: 🛠️ Compile Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

  test_coverage:
    name: ✅ Unit Test & Coverage Check
    runs-on: ubuntu-latest
    needs: compile  # only run if compile succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run Unit Tests
        run: ./gradlew test


      - name: Verify JaCoCo Coverage
        run: ./gradlew jacocoTestCoverageVerification


  deploy:
    name: 🚀 Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test_coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify gradlew exists
        run: ls -l ./gradlew

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Execute Gradle Command - assembleDebug
        run: ./gradlew assembleDebug

#      - name: Decode Firebase Service Account Key
#        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > serviceAccountKey.json
#
      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
#          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFile: ${{secrets.FIREBASE_SERVICE_ACCOUNT}}
          releaseNotes: "Automated build from develop"
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
