name: CI/CD - Build, Coverage, Deploy

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  compile:
    name: 🛠️ Compile Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

  test_coverage:
    name: ✅ Unit Test & Coverage Check
    runs-on: ubuntu-latest
    needs: compile  # only run if compile succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests & Generate Jacoco Report
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Enforce 80% Coverage
        run: |
          MISSED=$(grep -oPm1 "(?<=<counter type=\"LINE\" missed=\")[^\"]+" app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml | awk '{missed+=$1} END {print missed}')
          COVERED=$(grep -oPm1 "(?<=<counter type=\"LINE\" covered=\")[^\"]+" app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml | awk '{covered+=$1} END {print covered}')
          echo "Missed: $MISSED, Covered: $COVERED"
          TOTAL=$(echo "$MISSED + $COVERED" | bc)
          PERCENT=$(echo "scale=2; 100 * $COVERED / $TOTAL" | bc)
          echo "Coverage: $PERCENT%"
          if (( $(echo "$PERCENT < 80" | bc -l) )); then
            echo "❌ Coverage $PERCENT% is below required 80%"
            exit 1
          fi

  deploy:
    name: 🚀 Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test_coverage  # only run if tests pass and coverage is OK
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Decode Firebase Service Account Key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > serviceAccountKey.json

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          serviceCredentialsFile: serviceAccountKey.json
          releaseNotes: "Automated build from develop"
          groups: testers
          file: app/build/outputs/bundle/release/app-release.aab
